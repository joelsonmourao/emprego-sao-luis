name: CI
on: { push: { branches: [main, codex/reconstrucao-astro, codex/admin-negocio-completo] }, pull_request: {} }
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/empregos
      REDIS_URL: redis://127.0.0.1:6379
      UPLOADS_DIR: ${{ github.workspace }}/tmp/e2e-uploads
      APP_ENV: e2e
      COOKIE_SECURE: "false"
      AUTH_SECRET: ci-only-auth-secret-with-32-characters
      SITE_URL: http://127.0.0.1:4321
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empregos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d empregos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run migration:check
      - run: npm run db:migrate --workspace=@es/db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
