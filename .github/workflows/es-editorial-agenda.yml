name: Empregos Sao Luis - agenda editorial em producao
on:
  schedule:
    - cron: "30 10,11,15,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/es-editorial-agenda.yml
permissions:
  contents: write
concurrency:
  group: es-editorial-pipeline-main
  cancel-in-progress: false
jobs:
  check-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ler apenas codigo editorial da branch de producao
        uses: actions/checkout@v4
        with:
          ref: codex/admin-negocio-completo
          fetch-depth: 0
          persist-credentials: true
      - name: Detectar alteracoes editoriais ainda nao processadas
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          # Evita instalar todo o monorepo para revalidar exatamente os
          # mesmos arquivos quatro vezes ao dia. Qualquer alteracao dos
          # textos, calendario ou validador libera o processamento normal.
          source_commit="$(git log -1 --format=%H -- editorial scripts/build-auto-editorial.mjs apps/web/src/lib/auto-editorial.ts || true)"
          manifest_commit="$(git log -1 --format=%H -- apps/web/src/data/auto-editorial-manifest.json || true)"
          if [ -n "$source_commit" ] && [ -n "$manifest_commit" ] && git merge-base --is-ancestor "$source_commit" "$manifest_commit"; then
            echo "processar=nao" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteracao desde o ultimo manifesto validado. Nao reinstalar npm."
            echo "## Editorial" >> "$GITHUB_STEP_SUMMARY"
            echo "Nenhum texto ou regra nova para validar; agendamento futuro permanece ativo no site." >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          timezone = datetime.timezone(datetime.timedelta(hours=-3))
          day = datetime.datetime.now(timezone).date().isoformat()
          path = Path("apps/web/src/data/auto-editorial-manifest.json")
          calendar = Path("editorial/calendario-3-artigos-diarios-2026.json")
          manifest = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          plan = json.loads(calendar.read_text(encoding="utf-8")) if calendar.exists() else {}
          expected = next((len(x.get("posts", [])) for x in plan.get("days", []) if x.get("date") == day), 0)
          prepared = sum(isinstance(x, dict) and str(x.get("publishedAt", ""))[:10] == day for x in manifest)
          summary = f"Dia {day}: {prepared}/{expected} artigos no manifesto editorial."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary + "\\n")
          if prepared < expected:
              print("::warning::Ha pautas sem artigo validado; cron nao cria textos ausentes.")
          PY
          else
            echo "processar=sim" >> "$GITHUB_OUTPUT"
            echo "Alteracoes encontradas: manter validacao, build e commit completos."
            echo "Guias novos entram somente apos QA de texto, fontes e capas."
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.processar == 'sim'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
        if: steps.gate.outputs.processar == 'sim'
      - name: Validar textos existentes, bloquear duplicatas, gerar capas de autoresponsabilidade
        if: steps.gate.outputs.processar == 'sim'
        run: node scripts/build-auto-editorial.mjs
      - name: Checar integridade do projeto antes da entrega
        if: steps.gate.outputs.processar == 'sim'
        run: npm run typecheck
      - name: Atualizar apenas material aprovado na branch de producao
        if: steps.gate.outputs.processar == 'sim'
        shell: bash
        run: |
          git config user.name "es-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/auto-editorial-manifest.json apps/web/public/covers/auto-editorial/ editorial/automation-report.json
          if git diff --cached --quiet; then
            echo "Nenhum artigo adicional aceito. Nada e publicado sem texto completo."
          else
            git commit -m "editorial(auto): registrar artigos validados e capas"
            git push origin HEAD:codex/admin-negocio-completo
          fi
      - name: Guardar resultado de validacao e bloqueios
        if: steps.gate.outputs.processar == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: es-editorial-agenda
          path: editorial/automation-report.json
          if-no-files-found: warn
          retention-days: 30
