name: Empregos Sao Luis - validar estoque editorial de 15 artigos
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/es-validar-pacote-29out.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: es-editorial-pipeline-main
  cancel-in-progress: false
jobs:
  validar-e-preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admin-negocio-completo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Exigir 15 artigos originais para 28/10 a 01/11 e gerar capas
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-auto-editorial.mjs
          node - <<'JS'
          const fs = require("fs")
          const plan = JSON.parse(fs.readFileSync("editorial/calendario-3-artigos-diarios-2026.json","utf8"))
          const docs = JSON.parse(fs.readFileSync("apps/web/src/data/auto-editorial-manifest.json","utf8"))
          const dias = ["2026-10-28","2026-10-29","2026-10-30","2026-10-31","2026-11-01"];
          let total = 0;
          for(const date of dias) {
            const dia=plan.days.find(x=>x.date===date);
            if(!dia || dia.posts?.length!==3 || dia.posts.some(x=>x.status!=="DRAFT"))
              throw Error("Calendario incompleto: "+date);
            const slugs=dia.posts.map(x=>x.slug);
            if(new Set(slugs).size!==3) throw Error("Duplicidade calendario "+date);
            const validos=docs.filter(d=>slugs.includes(d.slug) && d.publishedAt?.startsWith(date));
            if(validos.length!==3 || validos.some(x=>x.editorialCheck!=="QA_AUTOMATIZADO_SEM_VERIFICACAO_HUMANA"))
              throw Error("QA bloqueou guia do dia "+date+": "+JSON.stringify(validos.map(x=>x.slug)));
            total += validos.length;
            console.log("ESTOQUE_DIA_VALIDADO",date,validos.length,validos.map(x=>x.slug).join(","));
          }
          if(total!==15)throw Error("Colchao incompleto: "+total+"/15");
          console.log("ESTOQUE_5_DIAS_VALIDADO",total);
          JS
      - run: npm run typecheck
      - name: Publicar somente manifestos e capas de artigos aceitos no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "es-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/auto-editorial-manifest.json apps/web/public/covers/auto-editorial/ editorial/automation-report.json
          if git diff --cached --quiet; then
            echo "PACOTE_SEM_ALTERACAO"
          else
            git commit -m "editorial(auto): aprovar estoque de 15 guias"
            git push origin HEAD:codex/admin-negocio-completo
          fi
