services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: empregos_staging, POSTGRES_USER: empregos, POSTGRES_PASSWORD: staging-only-change-me }
    volumes: [postgres_staging:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U empregos -d empregos_staging"], interval: 10s, timeout: 5s, retries: 10 }
  valkey:
    image: valkey/valkey:8-alpine
    volumes: [valkey_staging:/data]
    healthcheck: { test: [CMD, valkey-cli, ping], interval: 10s, timeout: 5s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: staging, MINIO_ROOT_PASSWORD: staging-only-change-me }
    volumes: [minio_staging:/data]
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    env_file: [.env.staging]
    ports: ["4321:4321"]
    depends_on: { postgres: { condition: service_healthy }, valkey: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: [.env.staging]
    depends_on: { postgres: { condition: service_healthy }, valkey: { condition: service_healthy } }
volumes: { postgres_staging: {}, valkey_staging: {}, minio_staging: {} }
